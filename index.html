<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elige tu número</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            margin-bottom: 15px;
        }

        #connection {
            display: inline-block;

            padding: 7px 14px;
            margin-bottom: 25px;

            border-radius: 20px;

            background: rgba(255,255,255,0.1);

            font-size: 13px;
            color: #facc15;
        }

        .name-box {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            max-width: 350px;

            padding: 14px;

            border: none;
            border-radius: 10px;

            font-size: 17px;

            outline: none;

            text-align: center;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(59,130,246,0.5);
        }

        .numbers {
            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 15px;
        }

        .number {
            min-height: 125px;

            border: none;
            border-radius: 18px;

            background: #22c55e;

            color: white;

            font-size: 32px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            padding: 10px;
        }

        .number:hover:not(:disabled) {
            transform: translateY(-5px);

            background: #16a34a;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.25);
        }

        .number.taken {
            background: #dc2626;

            cursor: not-allowed;
        }

        .number:disabled {
            opacity: 1;
        }

        .status {
            display: block;

            font-size: 13px;

            margin-top: 8px;

            font-weight: normal;

            word-break: break-word;
        }

        .reset {
            margin-top: 30px;

            padding: 13px 25px;

            border: none;
            border-radius: 10px;

            background: #f59e0b;

            color: white;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;
        }

        .reset:hover {
            background: #d97706;
        }

        #message {
            min-height: 25px;

            margin-top: 18px;

            font-weight: bold;
        }

        .success {
            color: #86efac;
        }

        .error {
            color: #fca5a5;
        }

        .info {
            color: #bfdbfe;
        }

        @media (max-width: 650px) {

            h1 {
                font-size: 30px;
            }

            .numbers {
                grid-template-columns: repeat(2, 1fr);
            }

            .number {
                min-height: 105px;

                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎯 Elige tu número</h1>

    <p class="subtitle">
        Selecciona uno de los números disponibles
    </p>

    <div id="connection">
        🟡 Conectando con el servidor...
    </div>

    <div class="name-box">

        <input
            type="text"
            id="name"
            placeholder="Escribe tu nombre"
            maxlength="30"
            autocomplete="off"
        >

    </div>

    <!-- LOS NÚMEROS SE CREAN AQUÍ -->
    <div
        class="numbers"
        id="numbers">
    </div>

    <div id="message"></div>

    <button
        class="reset"
        id="resetButton">

        🔐 Reiniciar números

    </button>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue,
        runTransaction,
        set
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    /* =====================================================
       CONFIGURACIÓN DE TU FIREBASE
    ===================================================== */

    const firebaseConfig = {

        apiKey:
            "AIzaSyDQ1ceCrIvNDihouUCfAXMxItm77O1ljx8",

        authDomain:
            "cadena-a830a.firebaseapp.com",

        databaseURL:
            "https://cadena-a830a-default-rtdb.firebaseio.com",

        projectId:
            "cadena-a830a",

        storageBucket:
            "cadena-a830a.firebasestorage.app",

        messagingSenderId:
            "500237838437",

        appId:
            "1:500237838437:web:81c32f9780dbd2003ffe8c"
    };


    /* =====================================================
       INICIALIZAR FIREBASE
    ===================================================== */

    let database = null;
    let numbersRef = null;


    try {

        const app =
            initializeApp(firebaseConfig);

        database =
            getDatabase(app);

        numbersRef =
            ref(database, "numbers");

    } catch (error) {

        console.error(
            "Error iniciando Firebase:",
            error
        );

        document.getElementById(
            "connection"
        ).textContent =
            "🔴 Error de Firebase";
    }


    /* =====================================================
       VARIABLES
    ===================================================== */

    const numbersContainer =
        document.getElementById("numbers");

    const nameInput =
        document.getElementById("name");

    const message =
        document.getElementById("message");

    const connection =
        document.getElementById("connection");


    let takenNumbers = {};


    /* =====================================================
       CREAR LOS 10 NÚMEROS
       
       ESTO SE EJECUTA INMEDIATAMENTE.
    ===================================================== */

    function createNumbers() {

        numbersContainer.innerHTML = "";


        for (
            let number = 1;
            number <= 10;
            number++
        ) {

            const button =
                document.createElement("button");


            button.className =
                "number";


            /*
             * SI ESTÁ OCUPADO
             */

            if (
                takenNumbers[number]
            ) {

                button.classList.add(
                    "taken"
                );

                button.disabled =
                    true;

                button.innerHTML = `

                    ${number}

                    <span class="status">

                        🔒
                        ${escapeHtml(
                            takenNumbers[number].name
                        )}

                    </span>

                `;

            }


            /*
             * SI ESTÁ DISPONIBLE
             */

            else {

                button.innerHTML = `

                    ${number}

                    <span class="status">

                        DISPONIBLE

                    </span>

                `;


                button.addEventListener(
                    "click",
                    () => chooseNumber(number)
                );
            }


            numbersContainer.appendChild(
                button
            );
        }
    }


    /*
     * CREAR LOS NÚMEROS INMEDIATAMENTE
     */

    createNumbers();


    /* =====================================================
       ESCUCHAR FIREBASE
    ===================================================== */

    if (numbersRef) {

        onValue(

            numbersRef,

            (snapshot) => {

                takenNumbers =
                    snapshot.val() || {};

                createNumbers();

                connection.textContent =
                    "🟢 Conectado — sincronización activa";

                connection.style.color =
                    "#86efac";
            },

            (error) => {

                console.error(error);

                connection.textContent =
                    "🔴 Error conectando con Firebase";

                connection.style.color =
                    "#fca5a5";
            }
        );
    }


    /* =====================================================
       ELEGIR NÚMERO
    ===================================================== */

    async function chooseNumber(number) {

        const name =
            nameInput.value.trim();


        if (!name) {

            showMessage(
                "Primero escribe tu nombre.",
                "error"
            );

            nameInput.focus();

            return;
        }


        if (name.length < 2) {

            showMessage(
                "Escribe un nombre válido.",
                "error"
            );

            return;
        }


        if (!numbersRef) {

            showMessage(
                "Firebase no está conectado.",
                "error"
            );

            return;
        }


        const numberRef =
            ref(
                database,
                "numbers/" + number
            );


        try {

            /*
             * TRANSACTION:
             *
             * Si dos personas intentan tomar
             * el mismo número al mismo tiempo,
             * Firebase solo permitirá que una
             * gane.
             */

            const result =
                await runTransaction(

                    numberRef,

                    (currentData) => {

                        /*
                         * Ya está ocupado.
                         */

                        if (
                            currentData !== null
                        ) {

                            return;
                        }


                        /*
                         * Está disponible.
                         */

                        return {

                            name: name,

                            timestamp:
                                Date.now()
                        };
                    }
                );


            if (
                result.committed
            ) {

                showMessage(
                    `🎉 ¡Listo! Tu número es el ${number}.`,
                    "success"
                );

                nameInput.value = "";

            }

            else {

                showMessage(
                    "❌ Ese número ya fue tomado.",
                    "error"
                );
            }


        } catch (error) {

            console.error(
                "Error:",
                error
            );

            showMessage(
                "❌ No se pudo reclamar el número.",
                "error"
            );
        }
    }


    /* =====================================================
       REINICIAR
    ===================================================== */

    document
        .getElementById("resetButton")
        .addEventListener(
            "click",
            resetNumbers
        );


    async function resetNumbers() {

        const password =
            prompt(
                "🔐 Contraseña de administrador:"
            );


        if (
            password === null
        ) {
            return;
        }


        /*
         * CAMBIA ESTA CONTRASEÑA
         */

        const ADMIN_PASSWORD =
            "2010";


        if (
            password !== ADMIN_PASSWORD
        ) {

            showMessage(
                "❌ Contraseña incorrecta.",
                "error"
            );

            return;
        }


        const confirmation =
            confirm(
                "⚠️ ¿Seguro que quieres liberar TODOS los números?"
            );


        if (!confirmation) {
            return;
        }


        try {

            await set(
                numbersRef,
                null
            );


            showMessage(
                "✅ Todos los números fueron liberados.",
                "success"
            );


        } catch (error) {

            console.error(error);

            showMessage(
                "❌ No se pudieron reiniciar los números.",
                "error"
            );
        }
    }


    /* =====================================================
       MENSAJES
    ===================================================== */

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            type;


        setTimeout(
            () => {

                message.textContent =
                    "";

                message.className =
                    "";

            },
            5000
        );
    }


    /* =====================================================
       EVITAR HTML MALICIOSO EN LOS NOMBRES
    ===================================================== */

    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            text;

        return div.innerHTML;
    }

</script>

</body>
</html>
