```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elige tu número</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .connection {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: #facc15;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .connection.online {
            color: #86efac;
        }

        .connection.offline {
            color: #fca5a5;
        }

        .name-box {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            max-width: 350px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            outline: none;
            text-align: center;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(59,130,246,0.5);
        }

        .numbers {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .number {
            min-height: 125px;
            border: none;
            border-radius: 18px;
            background: #22c55e;
            color: white;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            padding: 10px;
        }

        .number:hover:not(:disabled) {
            transform: translateY(-5px);
            background: #16a34a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .number.taken {
            background: #dc2626;
            cursor: not-allowed;
        }

        .number:disabled {
            cursor: not-allowed;
        }

        .status {
            display: block;
            font-size: 13px;
            margin-top: 8px;
            font-weight: normal;
            word-break: break-word;
        }

        .reset {
            margin-top: 30px;
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            background: #f59e0b;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .reset:hover {
            background: #d97706;
        }

        .message {
            min-height: 25px;
            margin-top: 20px;
            font-weight: bold;
        }

        .success {
            color: #86efac;
        }

        .error {
            color: #fca5a5;
        }

        .info {
            color: #bfdbfe;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 650px) {

            body {
                padding: 15px;
            }

            h1 {
                font-size: 30px;
            }

            .numbers {
                grid-template-columns: repeat(2, 1fr);
            }

            .number {
                min-height: 105px;
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎯 Elige tu número</h1>

    <p class="subtitle">
        Selecciona uno de los números disponibles
    </p>

    <div id="connection" class="connection">
        🟡 Conectando con Firebase...
    </div>

    <div class="name-box">
        <input
            type="text"
            id="name"
            placeholder="Escribe tu nombre"
            maxlength="30"
            autocomplete="off"
        >
    </div>

    <div id="numbers" class="numbers">
        <!-- Los números se generan aquí -->
    </div>

    <div id="message" class="message"></div>

    <button
        id="resetButton"
        class="reset hidden"
        type="button"
    >
        🔐 Reiniciar números
    </button>

</div>


<script type="module">

    /*
    =========================================================
    FIREBASE
    =========================================================
    */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue,
        runTransaction,
        set
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    import {
        getAuth,
        signInAnonymously,
        onAuthStateChanged,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


    /*
    =========================================================
    CONFIGURACIÓN DE TU PROYECTO
    =========================================================
    */

    const firebaseConfig = {

        apiKey:
            "AIzaSyDQ1ceCrIvNDihouUCfAXMxItm77O1ljx8",

        authDomain:
            "cadena-a830a.firebaseapp.com",

        databaseURL:
            "https://cadena-a830a-default-rtdb.firebaseio.com",

        projectId:
            "cadena-a830a",

        storageBucket:
            "cadena-a830a.firebasestorage.app",

        messagingSenderId:
            "500237838437",

        appId:
            "1:500237838437:web:81c32f9780dbd2003ffe8c"
    };


    /*
    =========================================================
    INICIALIZAR FIREBASE
    =========================================================
    */

    const app =
        initializeApp(firebaseConfig);

    const database =
        getDatabase(app);

    const auth =
        getAuth(app);

    const numbersRef =
        ref(database, "numbers");


    /*
    =========================================================
    ELEMENTOS
    =========================================================
    */

    const numbersContainer =
        document.getElementById("numbers");

    const nameInput =
        document.getElementById("name");

    const message =
        document.getElementById("message");

    const connection =
        document.getElementById("connection");

    const resetButton =
        document.getElementById("resetButton");


    /*
    =========================================================
    VARIABLES
    =========================================================
    */

    let currentUser = null;

    let takenNumbers = {};

    const ADMIN_EMAIL =
        "marcojosue022010@gmail.com";


    /*
    =========================================================
    AUTENTICACIÓN
    =========================================================
    */

    onAuthStateChanged(auth, async (user) => {

        if (user) {

            currentUser = user;

            console.log(
                "Usuario conectado:",
                user.uid
            );

            connection.textContent =
                "🟢 Conectado a Firebase";

            connection.className =
                "connection online";

            /*
            Si es el administrador, mostramos
            el botón de reinicio.
            */

            if (
                user.email === ADMIN_EMAIL
            ) {

                resetButton.classList.remove(
                    "hidden"
                );

            }

            return;
        }


        /*
        Si no hay usuario, creamos una sesión
        anónima automáticamente.
        */

        try {

            await signInAnonymously(auth);

        } catch (error) {

            console.error(error);

            connection.textContent =
                "🔴 Error de autenticación";

            connection.className =
                "connection offline";

            showMessage(
                "No se pudo conectar con Firebase.",
                "error"
            );
        }

    });


    /*
    =========================================================
    ESCUCHAR LOS NÚMEROS EN TIEMPO REAL
    =========================================================
    */

    onValue(
        numbersRef,
        (snapshot) => {

            takenNumbers =
                snapshot.val() || {};

            createNumbers();

        },
        (error) => {

            console.error(error);

            showMessage(
                "No se pudieron cargar los números.",
                "error"
            );

        }
    );


    /*
    =========================================================
    CREAR LOS 10 NÚMEROS
    =========================================================
    */

    function createNumbers() {

        numbersContainer.innerHTML = "";


        for (
            let number = 1;
            number <= 10;
            number++
        ) {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className = "number";


            /*
            NÚMERO OCUPADO
            */

            if (takenNumbers[number]) {

                button.classList.add("taken");

                button.disabled = true;

                const name =
                    takenNumbers[number].name ||
                    "Ocupado";

                button.innerHTML = `
                    ${number}

                    <span class="status">
                        🔒 ${escapeHtml(name)}
                    </span>
                `;

            }


            /*
            NÚMERO DISPONIBLE
            */

            else {

                button.innerHTML = `
                    ${number}

                    <span class="status">
                        DISPONIBLE
                    </span>
                `;

                button.addEventListener(
                    "click",
                    () => chooseNumber(number)
                );
            }


            numbersContainer.appendChild(button);
        }
    }


    /*
    =========================================================
    ELEGIR NÚMERO
    =========================================================
    */

    async function chooseNumber(number) {

        if (!currentUser) {

            showMessage(
                "Espera un momento mientras conectamos con Firebase.",
                "error"
            );

            return;
        }


        const name =
            nameInput.value.trim();


        if (!name) {

            showMessage(
                "Primero escribe tu nombre.",
                "error"
            );

            nameInput.focus();

            return;
        }


        if (name.length > 30) {

            showMessage(
                "El nombre es demasiado largo.",
                "error"
            );

            return;
        }


        const numberRef =
            ref(
                database,
                "numbers/" + number
            );


        try {

            /*
            TRANSACTION = evita que dos personas
            puedan reclamar el mismo número
            simultáneamente.
            */

            const result =
                await runTransaction(
                    numberRef,
                    (currentData) => {

                        /*
                        Si alguien ya lo tomó,
                        NO modificamos nada.
                        */

                        if (
                            currentData !== null
                        ) {

                            return;

                        }


                        /*
                        Si está libre,
                        lo reclamamos.
                        */

                        return {

                            name: name,

                            uid: currentUser.uid,

                            timestamp:
                                Date.now()
                        };

                    }
                );


            if (result.committed) {

                showMessage(
                    `🎉 ¡Listo! El número ${number} es tuyo.`,
                    "success"
                );

                nameInput.value = "";

            } else {

                showMessage(
                    `❌ El número ${number} acaba de ser tomado por otra persona.`,
                    "error"
                );
            }


        } catch (error) {

            console.error(
                "Error al reclamar:",
                error
            );

            showMessage(
                "❌ No se pudo reclamar el número.",
                "error"
            );
        }
    }


    /*
    =========================================================
    REINICIAR
    =========================================================
    */

    resetButton.addEventListener(
        "click",
        resetNumbers
    );


    async function resetNumbers() {

        /*
        Para el administrador usamos
        login por correo/contraseña.
        */

        const email =
            prompt(
                "Correo del administrador:"
            );


        if (!email) {
            return;
        }


        const password =
            prompt(
                "Contraseña del administrador:"
            );


        if (!password) {
            return;
        }


        try {

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            if (
                credential.user.email !==
                ADMIN_EMAIL
            ) {

                showMessage(
                    "❌ Esta cuenta no es administradora.",
                    "error"
                );

                return;
            }


            const confirmation =
                confirm(
                    "⚠️ ¿Seguro que quieres liberar TODOS los números?"
                );


            if (!confirmation) {
                return;
            }


            await set(
                numbersRef,
                null
            );


            showMessage(
                "✅ Todos los números fueron reiniciados.",
                "success"
            );


        } catch (error) {

            console.error(
                "Error de administrador:",
                error
            );


            showMessage(
                "❌ Correo o contraseña incorrectos.",
                "error"
            );
        }
    }


    /*
    =========================================================
    MENSAJES
    =========================================================
    */

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;


        setTimeout(
            () => {

                message.textContent =
                    "";

                message.className =
                    "message";

            },
            5000
        );
    }


    /*
    =========================================================
    PROTEGER NOMBRES HTML
    =========================================================
    */

    function escapeHtml(text) {

        const element =
            document.createElement("div");

        element.textContent =
            text;

        return element.innerHTML;
    }


    /*
    =========================================================
    MOSTRAR NÚMEROS INICIALMENTE
    =========================================================
    */

    createNumbers();

</script>

</body>
</html>
